<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

<!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container d-flex justify-content-between align-items-center">
    <span class="navbar-brand mb-0 h1">Expense Tracker</span>
    <button id="themeToggle" class="btn btn-outline-light btn-sm">🌙 Dark mode</button>
  </div>
</nav>
<main class="container pb-5">

  <!-- Alerts show up here -->
    <div id="alertBox"></div>

 <!-- Summary cards -->
<div class="summary-grid mb-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="text-muted small">Total</div>
      <div id="totalAmount" class="fs-3 fw-bold">0.00</div>
    </div>
  </div>
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="text-muted small">Number of expenses</div>
      <div id="expenseCount" class="fs-3 fw-bold">0</div>
    </div>
  </div>
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="text-muted small">Highest expense</div>
      <div id="highestAmount" class="fs-3 fw-bold">0.00</div>
      <div id="highestTitle" class="small text-muted">-</div>
    </div>
  </div>
</div>

<!-- Chart: expenses by category -->
<div class="card shadow-sm mb-4">
  <div class="card-body">
    <h2 class="h5 mb-3">Expenses by category</h2>
    <canvas id="categoryChart" height="100"></canvas>
  </div>
</div>

 <!-- Add expense form -->
<div class="card shadow-sm mb-4">
  <div class="card-body">
    <h2 class="h5 mb-3">Add an expense</h2>
    <form id="addForm" novalidate>
      <div class="row g-3">
        <div class="col-12 col-md-4">
          <label for="addTitle" class="form-label">Title</label>
          <input type="text" id="addTitle" class="form-control">
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-6 col-md-2">
          <label for="addAmount" class="form-label">Amount</label>
          <input type="number" id="addAmount" class="form-control" step="0.01">
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-6 col-md-2">
          <label for="addCategory" class="form-label">Category</label>
          <select id="addCategory" class="form-select">
            <option value="">Choose...</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Bills</option>
            <option>Entertainment</option>
            <option>Other</option>
          </select>
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-12 col-md-2">
          <label for="addDate" class="form-label">Date</label>
          <input type="date" id="addDate" class="form-control">
          <div class="invalid-feedback"></div>
        </div>
        <div class="col-12 col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100">Add</button>
        </div>
      </div>
    </form>
  </div>
</div>

 <!-- Filter + table -->
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 class="h5 mb-0">Expenses</h2>
          <div class="d-flex flex-wrap align-items-center gap-2">
            <label for="filterCategory" class="form-label mb-0">Category:</label>
            <select id="filterCategory" class="form-select w-auto">
              <option value="All">All</option>
              <option>Food</option>
              <option>Transport</option>
              <option>Bills</option>
              <option>Entertainment</option>
              <option>Other</option>
            </select>

            <label for="filterMonth" class="form-label mb-0 ms-2">Month:</label>
            <select id="filterMonth" class="form-select w-auto">
              <option value="All">All</option>
              <option value="01">January</option>
              <option value="02">February</option>
              <option value="03">March</option>
              <option value="04">April</option>
              <option value="05">May</option>
              <option value="06">June</option>
              <option value="07">July</option>
              <option value="08">August</option>
              <option value="09">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </div>
        </div>

        <!-- Spinner: hidden until a request is running -->
        <div id="spinner" class="text-center my-4 d-none">
          <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <!-- Rows are built by JavaScript -->
            <tbody id="expenseTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

<!-- Edit modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h5">Edit expense</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editForm" novalidate>
          <div class="mb-3">
            <label for="editTitle" class="form-label">Title</label>
            <input type="text" id="editTitle" class="form-control">
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="editAmount" class="form-label">Amount</label>
            <input type="number" id="editAmount" class="form-control" step="0.01">
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="editCategory" class="form-label">Category</label>
            <select id="editCategory" class="form-select">
              <option value="">Choose...</option>
              <option>Food</option>
              <option>Transport</option>
              <option>Bills</option>
              <option>Entertainment</option>
              <option>Other</option>
            </select>
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="editDate" class="form-label">Date</label>
            <input type="date" id="editDate" class="form-control">
            <div class="invalid-feedback"></div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="saveEditButton" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
  
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
